name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: docx_generator
        run: flutter pub get

      - name: Verify formatting
        working-directory: docx_generator
        run: dart format --set-exit-if-changed .

      - name: Analyze
        working-directory: docx_generator
        run: flutter analyze

      - name: Run tests
        working-directory: docx_generator
        run: flutter test
